apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-disco-local-01
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: armazenamento-rapido
  hostPath:
    path: "/var/discos/dados-app" # Caminho real no nó do MicroK8s
