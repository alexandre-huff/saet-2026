apiVersion: v1
kind: Pod
metadata:
  name: app-banco-dados
  namespace: aula-k8s
spec:
  containers:
  - name: postgresql
    image: postgres:15-alpine
    env:
    - name: POSTGRES_PASSWORD
      value: "senhaSegura123"
    volumeMounts:
    - name: volume-dados-postgres  
      mountPath: /var/lib/postgresql/data # Ponto de montagem dentro do contêiner 
  volumes:
  - name: volume-dados-postgres
    persistentVolumeClaim:
      claimName: pvc-banco-dados # Referência ao PVC criado anteriormente
