apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-banco-dados
  namespace: aula-k8s
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: armazenamento-rapido # Deve ser idêntica à SC ou PV desejado
  resources:
    requests:
      storage: 2Gi # Solicita 2GB (pode se conectar ao PV de 5GB acima)
